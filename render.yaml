# Render blueprint. Point a new Blueprint at this repo and it provisions the
# backend; the frontend goes to Vercel separately.
#
# Set these in the Render dashboard after the first deploy:
#   MODEL_URL       direct-download link to the .pkl (weights are gitignored)
#   MODEL_SHA256    optional integrity check -- `sha256sum <your>.pkl`
#   ALLOWED_ORIGINS your Vercel production URL
services:
  - type: web
    name: oral-cancer-api
    runtime: python
    # MEASURED: ~470 MB resident with the model loaded, plus up to ~37 MB to
    # decode a 12-megapixel upload. The free tier's 512 MB will OOM. Starter
    # (2 GB) is the smallest plan with real headroom.
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEVICE
        value: cpu
      - key: THRESHOLD
        value: "0.5"
      - key: POSITIVE_CLASS_INDEX
        value: "1"
      - key: MODEL_OUTPUTS_PROBABILITY
        value: "false"
      - key: MODEL_PATH
        value: models/EfficientNetB0_Dataset02_OralCancer_EXP4A.pkl
      # Set in the dashboard, not here -- keeps the URL out of git.
      - key: MODEL_URL
        sync: false
      - key: MODEL_SHA256
        sync: false
      # Only needed when MODEL_URL requires credentials (private bucket,
      # private Hugging Face repo). A presigned URL needs no token.
      - key: MODEL_AUTH_TOKEN
        sync: false

      # --- Memory ---------------------------------------------------------
      # Measured footprint: ~470 MB resident with the model loaded, before
      # request buffers. torch alone accounts for ~270 MB and torchvision a
      # further ~95 MB. These trim thread-local arenas; they do not change the
      # fact that this does not fit in a 512 MB instance (see plan, above).
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: ALLOWED_ORIGINS
        sync: false
      # Matches Vercel preview deployments, which get a new host per commit.
      - key: ALLOWED_ORIGIN_REGEX
        sync: false
